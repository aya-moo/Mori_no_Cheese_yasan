<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <!--「width=device-width」は「デバイスの実際の幅に合わせて表示して！」-->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>森のチーズ屋さん</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/stylesheet.css">
</head>

<body>
  <div class="main">
    <header>
      <div class="container">
        <div class="header-left">
          <a href="#">
            <img class="logo" src="image\rogo2.svg">
          </a>
        </div>
        <div class="header-right">
          <ul>
            <li><a href="#TOP">TOP</a></li>
            <li><a href="#MENU">MENU</a></li>
            <li><a href="#ABOUT">ABOUT</a></li>
          </ul>
        </div>
      </div>

    </header>

    <div class="content-wrapper">
      <div class="catchcopy-wrapper-">
        <h1 class="catch-copy1">CHEESE LOVERS<br>WELCOME!</h1>
        <h2 class="catch-copy2">ちょっとだけ<br>しあわせ多めでいこう。</h2>
      </div>


      <div class="concept-wrapper">
        <div class="concept-left">
          <img class="concept-img" src="image\Cheese-Latte.png" alt="チーズラテ">
          <img class="concept-img" src="image\Basque-Cheesecake.png" alt="チーズケーキ">
        </div>

        <div class="concept-center">
          <img class="concept-logo" src="image\rogo1.svg">
          <h2 class="concept-title">CONCEPT</h2>
          <div class="concept-text">
          <p>森のチーズ屋さんは、<br>
            ”ちいさなしあわせチーズ”をテーマに、<br>
            世界中から集めた美味しいチーズを<br>
            みなさまにお届けします。</p>

          <p>濃厚だけれど重くない、<br>
            口に入れた瞬間ふわっととろける―― <br>
            そんな、誰でも思わず笑顔になれる<br>
            チーズの味わいを目指しています。</p>

          <p>ここでしか味わえない <br>
            “チーズ好きのためのメニュー”を<br>
            ぜひお楽しみください。</p>
          </div>
        </div>

        <div class="concept-right">
          <img class="concept-img" src="image\Tiramisu.png">
          <img class="concept-img" src="image\Cheese-Smoothie.png">
        </div>

      </div>







    </div>











  </div>




</body>

</html>
